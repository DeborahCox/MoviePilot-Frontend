name: Baseline Diff Tests

on:
  workflow_dispatch:
    inputs:
      BASE_SHA:
        description: 'Baseline commit for comparison (default: HEAD^)'
        required: false
        default: ''
  pull_request:
    branches:
      - v3

permissions:
  contents: read

concurrency:
  group: baseline-diff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline-diff:
    name: Compare failures against baseline
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - name: Checkout head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve baseline SHA
        id: base
        shell: bash
        env:
          INPUT_BASE_SHA: ${{ github.event.inputs.BASE_SHA }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$INPUT_BASE_SHA" ]; then
            echo "sha=$INPUT_BASE_SHA" >> "$GITHUB_OUTPUT"
          elif [ -n "$PR_BASE_SHA" ]; then
            echo "sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create baseline worktree
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/baseline" "$BASE_SHA"
          cp package.json yarn.lock "$RUNNER_TEMP/baseline/"
          mkdir -p reports "$RUNNER_TEMP/baseline/reports"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies (head)
        run: yarn --frozen-lockfile

      - name: Install dependencies (baseline)
        working-directory: ${{ runner.temp }}/baseline
        run: yarn --frozen-lockfile

      - name: Validate comparator
        run: node --test .github/scripts/baseline-diff.test.mjs

      - name: Run full test suite on head and baseline
        shell: bash
        run: |
          set +e
          yarn test:run --serial --root="$PWD" --reporter=json --outputFile=reports/head.json --silent=passed-only
          echo $? > reports/head.exit
          (
            cd "$RUNNER_TEMP/baseline"
            yarn test:run --serial --root="$PWD" --reporter=json --outputFile=reports/baseline.json --silent=passed-only
          )
          echo $? > reports/baseline.exit
          set -e
          cp "$RUNNER_TEMP/baseline/reports/baseline.json" reports/baseline.json
          node -e "const r=require('./reports/baseline.json'); if ((r.numTotalTests ?? 0) === 0) console.warn('WARNING: baseline suite ran 0 tests; check --root and setupFiles resolution')"

      - name: Compare failures
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node .github/scripts/baseline-diff.mjs \
            --base-report reports/baseline.json \
            --head-report reports/head.json \
            --base-exit "$(cat reports/baseline.exit)" \
            --head-exit "$(cat reports/head.exit)" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --markdown-output baseline-diff.md \
            --json-output baseline-diff.json
          cat baseline-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload baseline diff artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-diff-reports
          path: |
            baseline-diff.md
            baseline-diff.json
            reports/head.json
            reports/baseline.json
            reports/head.exit
            reports/baseline.exit
          if-no-files-found: warn
          retention-days: 7
